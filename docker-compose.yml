x-milvus-image: &milvus-image milvusdb/milvus:v3.0.2

services:
  # ---- Vector store (Milvus standalone, integrated stack) ----------------
  # Local dev without Docker uses Milvus Lite (embedded, no services below).
  # Set VECTOR_STORE_BACKEND=milvus and MILVUS_URI=http://milvus-standalone:19530
  # in backend's environment to use this stack instead.
  milvus-volume-init:
    image: *milvus-image
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          chown -R "$${uid}:$${gid}" /var/lib/milvus
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus

  etcd:
    container_name: drishti-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: drishti-milvus-minio
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    container_name: drishti-milvus-standalone
    image: *milvus-image
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_started
      minio:
        condition: service_started

  # ---- Simulated drone fleet gateway --------------------------------------
  drone-gateway:
    build:
      context: ./drone-gateway
    container_name: drishti-drone-gateway
    env_file:
      - .env
    environment:
      DATA_IMAGES_DIR: /data/images
      DATA_LABELS_FILE: /data/labels/labels.jsonl
    volumes:
      - ./data:/data:ro
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---- Backend: perception + orchestration + agents + RAG + safety -------
  backend:
    build:
      context: ./backend
    container_name: drishti-backend
    env_file:
      - .env
    environment:
      DRONE_GATEWAY_URL: http://drone-gateway:8100
      MILVUS_URI: http://milvus-standalone:19530
      VECTOR_STORE_BACKEND: milvus
      DATA_SOPS_DIR: /data/sops
      DATA_IMAGES_DIR: /data/images
      DATA_LABELS_FILE: /data/labels/labels.jsonl
      MEMORY_DB_PATH: /data/memory/drishti.db
      DEVICE: cpu
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      drone-gateway:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---- Frontend operator dashboard ----------------------------------------
  frontend:
    build:
      context: ./frontend
    container_name: drishti-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
