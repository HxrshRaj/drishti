name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install CPU torch first (smaller, avoids CUDA wheels on CI)
        run: pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install backend deps
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Pytest (CPU-only; GPU-only tests are skipped automatically)
        env:
          DEVICE: cpu
          VECTOR_STORE_BACKEND: milvus_lite
          VECTOR_STORE_URI: ./data/ci_milvus_lite.db
          DATA_SOPS_DIR: ../data/sops
          DATA_IMAGES_DIR: ../data/images
          DATA_LABELS_FILE: ../data/labels/labels.jsonl
          MEMORY_DB_PATH: ./data/ci_memory.db
        run: pytest -q

  gateway-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drone-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: drone-gateway/requirements-dev.txt
      - name: Install gateway deps
        run: pip install -r requirements-dev.txt
      - name: Pytest
        env:
          DATA_IMAGES_DIR: ../data/images
          DATA_LABELS_FILE: ../data/labels/labels.jsonl
        run: pytest -q

  eval:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install CPU torch first
        run: pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install backend deps
        run: pip install -r requirements-dev.txt
      - name: Run VLM + retrieval eval (CPU, small subset)
        env:
          DEVICE: cpu
        run: python ../benchmarks/eval.py --limit 20 --out ../benchmarks/results/ci_eval.json

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  azure-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/azure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: deploy/azure/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - name: Start the Azure Storage emulator (Azurite)
        run: |
          npm install -g azurite
          azurite --silent --location /tmp/azurite --skipApiVersionCheck &
          sleep 5
      - name: Function, storage and infrastructure tests
        run: python -m pytest tests -q
