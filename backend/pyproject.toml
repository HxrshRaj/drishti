[project]
name = "drishti-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]  # UP042: (str, Enum) kept deliberately over StrEnum for clearer JSON/pydantic interop

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
